name: Build Pokémon Emeraude - Abdel Edition MAX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi build-essential git libpng-dev

      - name: Trouver la base MAX
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project

          ZIP=""
          while IFS= read -r -d '' f; do
            if unzip -l "$f" | grep -qE 'abdel_max_source/Makefile$'; then
              ZIP="$f"
              break
            fi
          done < <(find . -maxdepth 2 -type f -name '*.zip' -print0)

          if [ -z "$ZIP" ]; then
            echo "ERREUR: Pokemon_Emeraude_Abdel_Edition_MAX_SOURCE.zip introuvable."
            find . -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Archive: $ZIP"
          unzip -q "$ZIP" -d project
          mv project/abdel_max_source project/pokeemerald-fr-master
          test -f project/pokeemerald-fr-master/Makefile

      - name: Installer agbcc
        shell: bash
        run: |
          set -e
          rm -rf agbcc
          git clone --depth 1 https://github.com/pret/agbcc.git agbcc
          cd agbcc
          ./build.sh
          ./install.sh ../project/pokeemerald-fr-master
          test -x ../project/pokeemerald-fr-master/tools/agbcc/bin/agbcc

      - name: Compiler la ROM
        working-directory: project/pokeemerald-fr-master
        shell: bash
        run: |
          set -e
          make -j2 all
          test -s pokeemerald.gba
          ls -lh pokeemerald.gba
          sha256sum pokeemerald.gba

      - name: Vérification finale
        working-directory: project/pokeemerald-fr-master
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pokeemerald.gba')
          b = p.read_bytes()
          print('Taille:', len(b))
          print('Titre:', b[0xA0:0xAC].rstrip(b'\0').decode('ascii', 'replace'))
          print('Code:', b[0xAC:0xB0].decode('ascii', 'replace'))
          assert len(b) == 16 * 1024 * 1024
          assert b[0xAC:0xB0] == b'BPEF'
          PY

      - name: Publier la ROM finale
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Emeraude-Abdel-Edition-MAX
          path: project/pokeemerald-fr-master/pokeemerald.gba
          if-no-files-found: error
          retention-days: 7
          test -s pokeemerald.gba

          echo "=== ROM PRODUITE ==="
          ls -lh pokeemerald.gba

          echo "=== SHA1 ==="
          sha1sum pokeemerald.gba

          echo "=== HEADER ==="
          xxd -l 192 pokeemerald.gba | head -20

      - name: Récupérer la ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Emeraude-Abdel-Edition-FR
          path: pokeemerald-fr/pokeemerald.gba
          if-no-files-found: error
          retention-days: 7          
