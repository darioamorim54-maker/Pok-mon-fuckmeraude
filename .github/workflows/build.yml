name: Build Pokémon Abdel Edition FR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            build-essential \
            git \
            libpng-dev

      - name: Récupérer la base française
        run: |
          set -e

          git clone --depth 1 --branch french \
            https://github.com/simsor/pokeemerald-fr.git \
            pokeemerald-fr

          test -f pokeemerald-fr/Makefile

          echo "=== BASE FRANÇAISE ==="
          pwd
          ls -lh pokeemerald-fr/Makefile

      - name: Modifier le vélo en GT86
        working-directory: pokeemerald-fr
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("src/data/items.h"),
              Path("src/data/text/item_descriptions.h"),
          ]

          for path in files:
              text = path.read_text(encoding="utf-8")

              text = text.replace("VELO COURSE", "GT86")
              text = text.replace("VELO CROSS", "GT86 RALLY")
              text = text.replace("VÉLO COURSE", "GT86")
              text = text.replace("VÉLO CROSS", "GT86 RALLY")

              path.write_text(text, encoding="utf-8")

          print("GT86 appliquée.")
          PY

      - name: Installer agbcc
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/pret/agbcc.git \
            agbcc

          cd agbcc
          ./build.sh
          ./install.sh ../pokeemerald-fr

          test -x ../pokeemerald-fr/tools/agbcc/bin/agbcc

      - name: Compiler
        working-directory: pokeemerald-fr
        run: |
          set -e

          echo "=== COMPILATION ==="
          make -j2

      - name: Vérifier la ROM
        working-directory: pokeemerald-fr
        run: |
          set -e

          test -s pokeemerald.gba

          echo "=== ROM PRODUITE ==="
          ls -lh pokeemerald.gba

          echo "=== SHA1 ==="
          sha1sum pokeemerald.gba

          echo "=== HEADER ==="
          xxd -l 192 pokeemerald.gba | head -20

      - name: Récupérer la ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Emeraude-Abdel-Edition-FR
          path: pokeemerald-fr/pokeemerald.gba
          if-no-files-found: error
          retention-days: 7          
