name: Build Pokémon Emeraude - Abdel Edition MAX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            build-essential \
            git \
            libpng-dev

      - name: Trouver la base MAX
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP=""

          while IFS= read -r -d '' f; do
            echo "Test du fichier : $f"

            # Vérifier que c'est bien un ZIP valide
            if ! unzip -t "$f" >/dev/null 2>&1; then
              echo "ZIP invalide, on passe au suivant."
              continue
            fi

            # Vérifier qu'il contient bien notre base MAX
            if unzip -l "$f" | grep -qE 'abdel_max_source/Makefile$'; then
              ZIP="$f"
              echo "BASE MAX TROUVÉE : $ZIP"
              break
            fi

          done < <(find . -maxdepth 2 -type f -name '*.zip' -print0)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucune base MAX valide trouvée."
            echo "ZIP présents dans le dépôt :"
            find . -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          fi

          unzip -q "$ZIP" -d project

          test -d project/abdel_max_source
          test -f project/abdel_max_source/Makefile

          mv project/abdel_max_source project/pokeemerald-fr-master

          echo "Base MAX installée avec succès."

      - name: Installer agbcc
        shell: bash
        run: |
          set -e

          rm -rf agbcc

          git clone --depth 1 \
            https://github.com/pret/agbcc.git \
            agbcc

          cd agbcc

          ./build.sh
          ./install.sh ../project/pokeemerald-fr-master
          chmod +x ../project/pokeemerald-fr-master/tools/gbagfx/gbagfx
          chmod +x ../project/pokeemerald-fr-master/tools/gbafix/gbafix
          test -x ../project/pokeemerald-fr-master/tools/agbcc/bin/agbcc

      - name: Compiler la ROM
        working-directory: project/pokeemerald-fr-master
        shell: bash
        run: |
          set -e

          make -j2 all

          test -s pokeemerald.gba

          echo "=== ROM PRODUITE ==="
          ls -lh pokeemerald.gba

          echo "=== SHA256 ==="
          sha256sum pokeemerald.gba

      - name: Vérifier la ROM
        working-directory: project/pokeemerald-fr-master
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("pokeemerald.gba")
          b = p.read_bytes()

          print("Taille :", len(b))
          print("Titre  :", b[0xA0:0xAC].rstrip(b"\0").decode("ascii", "replace"))
          print("Code   :", b[0xAC:0xB0].decode("ascii", "replace"))

          assert len(b) == 16 * 1024 * 1024
          assert b[0xAC:0xB0] == b"BPEF"

          print("Vérification OK.")

          PY

      - name: Publier la ROM finale
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Emeraude-Abdel-Edition-MAX
          path: project/pokeemerald-fr-master/pokeemerald.gba
          if-no-files-found: error
          retention-days: 7
